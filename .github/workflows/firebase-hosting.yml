name: Build and manually deploy WarkopLink

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Centang hanya jika deploy Firebase Hosting produksi sudah disetujui"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund

      - name: Load public Firebase web configuration
        run: cp .env.example .env

      - name: Build community app
        run: npm run build

      - name: Verify Hosting build output
        run: test -s dist/index.html

      - name: Upload Hosting build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: ${{ inputs.confirm_production_deploy == true }}
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Hosting build artifact
        uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist/

      - name: Verify downloaded release files
        run: |
          test -s dist/index.html
          test -s firebase.json
          test -s firestore.rules
          test -s firestore.indexes.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SL_COMMUNITY_PLATFORM }}

      - name: Identify deployment principal (email only)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SL_COMMUNITY_PLATFORM }}
        run: |
          node -e 'const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON); console.log("Firebase deploy service account:", c.client_email)'

      - name: Deploy Hosting, Firestore Rules, and indexes
        run: npx --yes firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project sl-community-platform --non-interactive
