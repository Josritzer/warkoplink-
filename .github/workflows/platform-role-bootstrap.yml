name: Bootstrap WarkopLink Super Admin

on:
  workflow_dispatch:
    inputs:
      confirm_super_admin_bootstrap:
        description: "Setujui aktivasi Super Admin untuk akun pemilik WarkopLink"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: warkoplink-platform-role-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-super-admin:
    if: ${{ inputs.confirm_super_admin_bootstrap == true }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Authenticate with existing Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SL_COMMUNITY_PLATFORM }}

      - name: Verify and grant the fixed owner account
        run: >-
          node scripts/set-platform-role.mjs
          OYgUG5eMWjfmHJ0VLaSXr34H7Dv2
          super_admin
          srawungjagad3714@gmail.com
          --bootstrap
          --apply
