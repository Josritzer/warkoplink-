services:
  - type: web
    name: sl-community-platform
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBybSZDKMxhtF8KRGlBIbWLuqkiLSiBrzA
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: sl-community-platform.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: sl-community-platform
      - key: VITE_FIREBASE_APP_ID
        value: 1:77912673126:web:fee4ac36c32dc92c1316a7
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "77912673126"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: sl-community-platform.firebasestorage.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
