name: Deploy SL Community Platform to Surge.sh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge-production
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit and component tests
        run: npm test

      - name: Firestore Rules tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-sl-community-rules "npm run test:rules"

      - name: Build production bundle
        run: npm run build

      - name: Configure SPA fallback
        run: cp dist/index.html dist/200.html

      - name: Deploy to Surge.sh
        if: github.ref == 'refs/heads/main'
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_LOGIN" ] || [ -z "$SURGE_TOKEN" ]; then
            echo "::error::Missing SURGE_LOGIN or SURGE_TOKEN repository secret."
            exit 1
          fi
          npx --yes surge ./dist sl-community-platform-josritzer.surge.sh --token "$SURGE_TOKEN"
