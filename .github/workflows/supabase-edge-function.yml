name: Supabase Edge Function CI

on:
  pull_request:
    paths:
      - "supabase/functions/firebase-auth-check/**"
      - "supabase/functions/media-gateway/**"
      - ".github/workflows/supabase-edge-function.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/firebase-auth-check/**"
      - ".github/workflows/supabase-edge-function.yml"

permissions:
  contents: read

jobs:
  firebase-auth-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check function and tests
        run: deno check supabase/functions/firebase-auth-check/index.ts supabase/functions/firebase-auth-check/index_test.ts
      - name: Run unit tests
        run: deno test supabase/functions/firebase-auth-check/index_test.ts supabase/functions/media-gateway/policy_test.ts supabase/functions/media-gateway/image-validation_test.ts
      - name: Type-check media gateway
        run: deno check supabase/functions/media-gateway/index.ts supabase/functions/media-gateway/policy_test.ts

  deploy-firebase-auth-gateway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: firebase-auth-gateway
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy WarkopLink Firebase auth gateway
        run: npx --yes supabase@latest functions deploy firebase-auth-check --project-ref klikvxuronunonymmiqv
      - name: Deploy WarkopLink media gateway
        run: npx --yes supabase@latest functions deploy media-gateway --project-ref klikvxuronunonymmiqv
