name: WarkopLink isolated PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: warkoplink-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/messages-friends-notifications' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate isolated Firebase preview configuration
        env:
          FIREBASE_PREVIEW_PROJECT_ID: ${{ vars.FIREBASE_PREVIEW_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY_PREVIEW }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN_PREVIEW }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PREVIEW_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID_PREVIEW }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID_PREVIEW }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET_PREVIEW }}
          FIREBASE_PREVIEW_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_PREVIEW_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_PREVIEW_PROJECT_ID" || "$FIREBASE_PREVIEW_PROJECT_ID" == "sl-community-platform" ]]; then
            echo "::error::FIREBASE_PREVIEW_PROJECT_ID wajib menunjuk proyek Firebase pengujian terpisah, bukan proyek produksi."
            exit 1
          fi
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_STORAGE_BUCKET FIREBASE_PREVIEW_SERVICE_ACCOUNT; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Konfigurasi preview belum lengkap: $key"
              exit 1
            fi
          done
          if [[ "$VITE_FIREBASE_PROJECT_ID" != "$FIREBASE_PREVIEW_PROJECT_ID" ]]; then
            echo "::error::Build Firebase project ID tidak cocok dengan proyek preview."
            exit 1
          fi
          echo "Preview target verified: $FIREBASE_PREVIEW_PROJECT_ID"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build against the isolated preview Firebase project
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY_PREVIEW }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN_PREVIEW }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PREVIEW_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID_PREVIEW }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID_PREVIEW }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET_PREVIEW }}
        run: |
          set -euo pipefail
          {
            printf 'VITE_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY"
            printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$VITE_FIREBASE_AUTH_DOMAIN"
            printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$VITE_FIREBASE_PROJECT_ID"
            printf 'VITE_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID"
            printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$VITE_FIREBASE_MESSAGING_SENDER_ID"
            printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$VITE_FIREBASE_STORAGE_BUCKET"
          } > .env
          npm run build

      - name: Authenticate to the isolated Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_PREVIEW_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes to preview project only
        env:
          FIREBASE_PREVIEW_PROJECT_ID: ${{ vars.FIREBASE_PREVIEW_PROJECT_ID }}
        run: |
          npx --yes firebase-tools deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PREVIEW_PROJECT_ID" --non-interactive

      - name: Publish temporary Hosting preview
        env:
          FIREBASE_PREVIEW_PROJECT_ID: ${{ vars.FIREBASE_PREVIEW_PROJECT_ID }}
        run: |
          npx --yes firebase-tools hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --project "$FIREBASE_PREVIEW_PROJECT_ID" --expires 7d --non-interactive

      - name: Report isolated preview target
        if: success()
        run: |
          echo "Preview deployed only to Firebase test project: ${{ vars.FIREBASE_PREVIEW_PROJECT_ID }}"
          echo "Channel: pr-${{ github.event.pull_request.number }}"
