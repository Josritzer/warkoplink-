name: Deploy SL RELAX COMMUNITY to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "firebase.json"
      - ".firebaserc"
      - ".env.example"
      - "firestore.rules"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Load public Firebase web configuration
        run: cp .env.example .env

      - name: Build community app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SL_COMMUNITY_PLATFORM }}

      - name: Deploy Hosting and Firestore Rules
        run: npx --yes firebase-tools deploy --only hosting,firestore:rules --project sl-community-platform --non-interactive
