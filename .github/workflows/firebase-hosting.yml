name: Deploy SL Community Platform to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      deploy_firestore:
        description: "Sertakan Firestore Rules dan Indexes dalam deploy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Load public Firebase web configuration
        run: cp .env.example .env

      - name: Build community app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SL_COMMUNITY_PLATFORM }}

      - name: Identify deployment principal (email only)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SL_COMMUNITY_PLATFORM }}
        run: |
          node -e 'const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON); console.log("Firebase deploy service account:", c.client_email)'

      # Firestore deployment is an explicit opt-in on the manual production run.
      # Storage is intentionally excluded until Firebase Storage is explicitly initialized.
      - name: Deploy Hosting only
        run: npx --yes firebase-tools deploy --only hosting --project sl-community-platform --non-interactive

      - name: Deploy Firestore Rules and Indexes only when their source changes
        if: inputs.deploy_firestore == true
        run: npx --yes firebase-tools deploy --only firestore:rules,firestore:indexes --project sl-community-platform --non-interactive
